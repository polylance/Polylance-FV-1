services:
  - type: web
    name: polylance-chat-service
    env: node
    region: ohio
    plan: free
    rootDir: polylance-chat-service
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: polylance-chat-db
          property: connectionString
      - key: RPC_URL
        value: https://rpc-amoy.polygon.technology
      - key: JOB_FACTORY_ADDRESS
        value: 0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0
      - key: ALLOWED_ORIGINS
        value: https://polylance.github.io,https://polylance.codes
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: 10000
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: FILEBASE_ACCESS_KEY
        sync: false
      - key: FILEBASE_SECRET_KEY
        sync: false
      - key: FILEBASE_BUCKET
        value: polylance-db
      - key: FILEBASE_ENDPOINT
        value: https://s3.filebase.io
      - key: FILEBASE_REGION
        value: auto
      - key: IPFS_GATEWAY_URL
        value: https://ipfs.filebase.io/ipfs/

databases:
  - name: polylance-chat-db
    plan: free
    region: ohio
