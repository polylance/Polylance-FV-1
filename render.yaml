services:
  - type: web
    name: polylance-chat-service
    env: node
    region: ohio
    plan: free
    rootDir: polylance-chat-service
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: polylance-chat-db
          property: connectionString
      - key: RPC_URL
        value: https://rpc-amoy.polygon.technology
      - key: JOB_FACTORY_ADDRESS
        value: 0x8492796C544989f6F9BaEcEfD2cb8CA49E422776
      - key: FRONTEND_URL
        value: https://polylance.codes
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: 10000

databases:
  - name: polylance-chat-db
    plan: free
    region: ohio
