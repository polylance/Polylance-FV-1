<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What is PolyLance?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "PolyLance is a freelance marketplace on the Polygon blockchain where project funds are locked in an escrow smart contract. Clients fund milestone escrows, freelancers deliver work, and payment is released upon client approval or verifiable milestones. Completed jobs also earn verifiable on-chain reputation certificates."
      }
    },
    {
      "@type": "Question",
      "name": "How does PolyLance work?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Clients post a project, select an applicant, and fund escrow on Polygon PoS. The freelancer completes the milestone, uploads proof-of-work, and client approval instantly releases funds directly to the freelancer wallet. For multi-phase projects, contracts can be organized and funded milestone by milestone."
      }
    },
    {
      "@type": "Question",
      "name": "Do I need a crypto wallet to use PolyLance?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. You sign in and receive payments through a Polygon-compatible wallet such as MetaMask, Coinbase Wallet, or WalletConnect. Your cryptographic wallet address is your account identifier, eliminating passwords and centralized credential storage."
      }
    },
    {
      "@type": "Question",
      "name": "Which blockchain and tokens does PolyLance use?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "PolyLance operates on Polygon Mainnet (Chain ID 137). Supported payment tokens are native POL (the upgraded MATIC token), USDC, and USDT. Polygon delivers sub-cent network transaction fees and fast confirmations, making micro and enterprise freelance payments practical."
      }
    },
    {
      "@type": "Question",
      "name": "What is escrow and how does it protect me?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Escrow holds milestone payments inside an immutable Polygon smart contract rather than a platform bank account. Freelancers have cryptographic assurance that funds are committed before work begins, while clients retain control because funds release only after delivered deliverables are inspected and approved."
      }
    },
    {
      "@type": "Question",
      "name": "Is my money safe in PolyLance escrow?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Funds are secured in on-chain smart contracts deployed on Polygon PoS, with all deposits and payouts visible on Polygonscan. PolyLance contracts have undergone internal security hardening but have not yet received an external third-party firm audit. We recommend funding milestones incrementally."
      }
    },
    {
      "@type": "Question",
      "name": "When does the freelancer get paid?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The freelancer receives payment instantly when the client approves the submitted work. If a client becomes unresponsive after deliverables are submitted, the freelancer can trigger the on-chain auto-release function once the 7-day review period expires."
      }
    },
    {
      "@type": "Question",
      "name": "Does the freelancer need POL to receive payment?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No POL is required simply to receive funds released by the client, as the client pays the release transaction gas. However, freelancers need a tiny fraction of POL (typically under $0.01) to submit proof-of-work on-chain, propose terms, or initiate a claim."
      }
    },
    {
      "@type": "Question",
      "name": "Can I pay in milestones on PolyLance?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Projects can be structured into discrete milestones with dedicated budgets, timelines, and deliverables. Each milestone is funded and approved independently, mitigating risk for both parties across long-term engagements."
      }
    },
    {
      "@type": "Question",
      "name": "What happens if the client does not respond to a submission?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Clients have a standard 7-day review window after proof-of-work submission. If the client takes no action and does not request revisions or open a dispute, the freelancer can invoke JobEscrow.claimAutoRelease() on Polygon to release 100% of the milestone funds."
      }
    },
    {
      "@type": "Question",
      "name": "How much does PolyLance charge, and who pays it?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "PolyLance charges a 2.5% service fee to each side, 5% of the job budget in total. The client pays the job budget plus 2.5%, and the freelancer receives the job budget minus 2.5%. For example, on a 9 POL job the client pays 9.225 POL and the freelancer receives 8.775 POL. On a 10 USDC job, the client pays 10.25 USDC and the freelancer receives 9.75 USDC; on a 100 USDC job, the client pays 102.50 USDC and the freelancer receives 97.50 USDC; on a 1,000 USDC job, the client pays 1,025.00 USDC and the freelancer receives 975.00 USDC. Network (gas) fees are separate and are paid in POL to the Polygon network, not to PolyLance."
      }
    },
    {
      "@type": "Question",
      "name": "Are there other fees?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No other PolyLance fees apply to a job. The only additional cost is the Polygon network fee (gas) for blockchain transactions, paid in POL to the network."
      }
    },
    {
      "@type": "Question",
      "name": "Does the 2.5% fee apply to each milestone?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. When a contract is divided into milestones, the 2.5% client fee and 2.5% freelancer fee apply to each milestone amount independently upon funding and release."
      }
    },
    {
      "@type": "Question",
      "name": "What does \"Sign in with wallet\" do? Does it cost anything?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Signing in uses Sign-In with Ethereum (EIP-4361). It requires signing a cryptographic message proving wallet ownership. It is completely gasless, sends no on-chain transaction, and cannot move funds. Always verify the domain shows polylance.codes before signing."
      }
    },
    {
      "@type": "Question",
      "name": "Which wallets work with PolyLance?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Any Polygon-compatible Web3 wallet functions with PolyLance, including MetaMask, Coinbase Wallet, Rainbow, Rabby, and hundreds of mobile wallets via WalletConnect. Your wallet must be configured to Polygon Mainnet (Chain ID 137)."
      }
    },
    {
      "@type": "Question",
      "name": "Why does PolyLance prompt me to switch to Polygon?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "PolyLance escrow smart contracts are deployed natively on Polygon PoS. If your wallet is connected to Ethereum or another network, transactions cannot execute. PolyLance prompts a network switch to keep transaction fees negligible."
      }
    },
    {
      "@type": "Question",
      "name": "What happens if I lose access to my wallet?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because PolyLance is non-custodial, we cannot recover lost seed phrases or reverse blockchain transactions. Store your recovery phrase securely offline. PolyLance staff will never request your private key or recovery phrase."
      }
    },
    {
      "@type": "Question",
      "name": "How do I find and apply for jobs on PolyLance?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Navigate to Find Jobs, filter by required skill or budget, and review contract details. Click \"Apply for this job\" to submit your proposal. If the client selects you, terms and milestones can be finalized in the pre-negotiation channel before escrow funding."
      }
    },
    {
      "@type": "Question",
      "name": "How do I convert crypto earnings into my local currency?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Earnings arrive in your self-custody wallet as USDC or POL. You can convert them to local fiat via regulated cryptocurrency exchanges or off-ramp providers in your jurisdiction. Local tax and reporting rules vary; consult a qualified professional."
      }
    },
    {
      "@type": "Question",
      "name": "What are PolyLance work certificates?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Upon milestone approval, the JobFactory contract mints a Soulbound (ERC-5192) Reputation Token (SBT) to the freelancer wallet. It cryptographically binds project title, payment volume, and completion timestamps on-chain as permanent verifiable portfolio proof."
      }
    },
    {
      "@type": "Question",
      "name": "How do I hire a freelancer on PolyLance?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Post a project with milestone specifications, review applicant proposals and on-chain work certificates, select the best candidate, and fund the Polygon escrow. You review all deliverables before authorizing payment release."
      }
    },
    {
      "@type": "Question",
      "name": "Can I get a refund?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Before escrow is funded, you can cancel freely. After funding, funds can return to the client if the freelancer agrees to cancel, if the freelancer misses the deadline plus a 2-day grace period without delivering, or if a dispute is decided in the client's favor. PolyLance's 2.5% service fee is collected at funding, while 100% of the locked escrow principal is returned to the client upon cancellation. The freelancer service fee is never deducted on cancelled or refunded jobs. Once the client approves the work, payment can't be reversed. Network fees are never refundable."
      }
    },
    {
      "@type": "Question",
      "name": "What happens if client and freelancer disagree on deliverables?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Either party can open a formal dispute before funds are released. Both sides submit evidence hashes through the dispute room, and assigned JudgeDAO arbitrators evaluate deliverables against agreed terms. Arbitrator rulings can release funds 100% to either party or split them proportionally."
      }
    },
    {
      "@type": "Question",
      "name": "Are messages on PolyLance private and encrypted?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Messages are encrypted in transit using industry-standard TLS and authenticated session tokens. While communication between contract parties is restricted to authenticated participants, never share private keys, seed phrases, or sensitive passwords in chat."
      }
    },
    {
      "@type": "Question",
      "name": "How do I protect myself from freelance payment scams?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Keep all milestones and communications strictly within PolyLance smart contract escrow. Never accept off-platform payments or wire transfers. Verify signature prompts originate from polylance.codes, and never share recovery seed phrases with anyone."
      }
    },
    {
      "@type": "Question",
      "name": "What is AuditX?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "AuditX is PolyLance automated smart contract analysis workspace. It performs static analysis and AST checks on Solidity code, helping freelancers, clients, and developers identify vulnerabilities and code quality issues before releasing milestone escrow funds or deploying to mainnet."
      }
    },
    {
      "@type": "Question",
      "name": "Is AuditX a substitute for a professional third-party smart contract audit?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. AuditX is an automated static analysis hygiene tool designed to catch common programming bugs early. It is not an independent formal audit, cannot detect complex architectural or economic flaws, and does not provide an absolute guarantee of safety."
      }
    },
    {
      "@type": "Question",
