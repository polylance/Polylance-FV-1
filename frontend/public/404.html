<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>PolyLance Zenith</title>
    <script type="text/javascript">
      // Robust static host 404 Redirect preserving clean pathname
      (function() {
        var l = window.location;
        var cleanPath = l.pathname || '';
        var search = l.search || '';
        var hash = l.hash || '';

        // If visiting on a static host where deep paths return 404.html,
        // redirect to root with ?p= query parameter so index.html can restore clean path
        var redirectUrl = l.protocol + '//' + l.host + '/?p=' + encodeURIComponent(cleanPath + search + hash);
        l.replace(redirectUrl);
      })();
    </script>
  </head>
  <body>
  </body>
</html>
