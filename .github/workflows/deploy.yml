name: Deploy PolyLance to GitHub Pages

on:
  push:
    branches:
      - main
      - dev.sunny

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_WALLETCONNECT_PROJECT_ID: "3a8170812b534d0ff9d794f19a901d64"
          VITE_CHAT_SERVICE_URL: "https://polylance-fv-1.onrender.com"
          VITE_CLIENT_ADDRESS: "0x9999888877776666555544443333222211110000"
          VITE_TESTER_ADDRESS: "0x3333444455556666777788889999000011112222"
          VITE_JUDGE_ADDRESS: "0xB8aa0398B91A150B041DA819bc954Bb356e009Dd"
          VITE_JUDGE_GITHUB_USERNAME: "sunny200551"
          VITE_ADMIN_ADDRESS_1: "0x62cdfc0692cc675c95304bace2c834d8f901dcba"
          VITE_ADMIN_ADDRESS_2: "0x25F6C8ed995C811E6c0ADb1D66A60830E8115e9A"
          VITE_ADMIN_GITHUB_USERNAME: "akhilmuvva"
          VITE_ADMIN_ADDRESS_3: "0xb30F2eFBCEBC529d946e05C9ccE0f1ffFB7e1aB1"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
